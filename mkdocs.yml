site_name: INSPIRE DNN Mortality Pipeline
site_description: Predicting 30-day post-surgical mortality from clinical time series with a two-phase transformer, on the INSPIRE Korean perioperative dataset.
repo_url: https://github.com/thrisharajkumar/inspire-analysis-thrisha
repo_name: thrisharajkumar/inspire-analysis-thrisha

# All nav pages live directly inside docs/ — edit them there.
docs_dir: docs
site_dir: site

# Nav is grouped into top-level sections. With navigation.tabs enabled below, each
# top-level group becomes a tab in the header bar, with its pages in a dropdown —
# rather than one long flat sidebar list.
nav:
  - Current:
      - Latest Work & Results (start here): current/PACO_Net_Latest_Work_and_Results.md
      - Surgeon-Facing Summary: current/Surgeon_Facing_Summary.md
  - Archive - Planning & Reference:
      - Original Project README: archive/planning_and_reference/index.md
      - Research Aims & Objectives: archive/planning_and_reference/Research_Aim.md
      - Roadmap & Architecture: archive/planning_and_reference/roadmap_and_architecture.md
      - Research Notes & Questions: archive/planning_and_reference/research_notes.md
      - Feature Audit Findings: archive/planning_and_reference/feature_audit_findings.md
      - Data Imbalance & Imputation Reference: archive/planning_and_reference/Data_Imbalance_and_Imputation_Reference.md
      - ICD-10 Architecture Research: archive/planning_and_reference/ICD10_Architecture_Research.md
      - Clinical Questions: archive/planning_and_reference/Clinician_Questions.md
      - Meeting Questions: archive/planning_and_reference/Clinician_Validation.md
  - Archive - Results & History:
      - INSPIRE Project Notes: archive/results_and_history/INSPIRE_Project_Notes.md
      - EDA Findings (Full Dataset): archive/results_and_history/eda_findings.md
      - Complete Findings Summary: archive/results_and_history/INSPIRE_Complete_Findings_Summary.md
      - Model Baseline: archive/results_and_history/INSPIRE_Baseline_Pipeline_Summary.md
      - First Full-Scale Run — Meeting Summary: archive/results_and_history/INSPIRE_Meeting_Summary.md
      - Baseline Comparitive Study: archive/results_and_history/Base_Comparitive_Study_Models.md
      - Multimodal Notebook Summary: archive/results_and_history/Multimodal_Notebook_Summary.md
      - Novelty & Research Ledger (superseded): archive/results_and_history/Novelty_Research_Ledger.md
      - PACO-Net Original Design (superseded): archive/results_and_history/PACO_Net_Architecture.md
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
      - navigation.tabs
      - navigation.tabs.sticky
      - navigation.top
      - navigation.sections
      - navigation.collapse
      - content.code.copy
      - search.suggest  

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details