site_name: INSPIRE DNN Mortality Pipeline
site_description: Predicting 30-day post-surgical mortality from clinical time series with a two-phase transformer, on the INSPIRE Korean perioperative dataset.
repo_url: https://github.com/thrisharajkumar/inspire-analysis-thrisha
repo_name: thrisharajkumar/inspire-analysis-thrisha

# All nav pages live directly inside docs/ — edit them there.
docs_dir: docs
site_dir: site

# Nav is grouped into top-level sections. With navigation.tabs enabled below, each
# top-level group becomes a tab in the header bar, with its pages in a dropdown —
# rather than one long flat sidebar list.
nav:
  - Home: index.md
  - Data & Pipeline:
      - INSPIRE Project Notes: INSPIRE_Project_Notes.md
      - Feature Audit Findings: feature_audit_findings.md
      - EDA Findings (Full Dataset): eda_findings.md
      - Complete Findings Summary: INSPIRE_Complete_Findings_Summary.md
  - MULTIMODEL MODEL:
      - Model Baseline: INSPIRE_Baseline_Pipeline_Summary.md
      - Baseline Comparitive Study: Base_Comparitive_Study_Models.md
  - Research:
      - Research Aims & Objectives: Research_Aim.md
      - Roadmap & Architecture: roadmap_and_architecture.md
      - Research Notes & Questions: research_notes.md
      - Clinical Questions: Clinician_Questions.md
      - Meeting Questions: Clinician_Validation.md
      - ICD-10 Architecture Research: ICD10_Architecture_Research.md
  - Next-Gen Architecture:
      - PACO-Net Design: PACO_Net_Architecture.md
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
      - navigation.tabs
      - navigation.tabs.sticky
      - navigation.top
      - navigation.sections
      - navigation.collapse
      - content.code.copy
      - search.suggest  

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details